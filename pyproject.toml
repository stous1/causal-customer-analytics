[project]
name = "causal"
version = "0.1.0"
description = "Analítica de clientes causal y explicable con Santander y Hillstrom (caso 6 del portafolio de banca)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sergio Tous" }]
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "lightgbm",
    "shap",
    "econml",
    "dowhy",
    "scikit-uplift",
    "statsmodels",
    "altair",
    "vl-convert-python",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/causal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas del flujo completo (más lentas)",
]
